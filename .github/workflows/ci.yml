name: CI

on:
  push:
  pull_request:

# HAPI and OneBus are cloned next to this repo: the test scripts reach them as ../../../HAPI/include etc.
env:
  ORG: https://github.com/InternetOfPins
  # a change that spans repos uses one branch name in each: clone a sibling at this branch when it has one, else main
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  # The native test programs, warnings as errors, then again under ASan+UBSan.
  native:
    name: native (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
        with:
          path: OneMachine
      - name: Clone HAPI and OneBus
        run: |
          git clone --depth 1 $ORG/HAPI.git HAPI
          git clone --depth 1 --branch "$BRANCH" $ORG/OneBus.git OneBus || git clone --depth 1 $ORG/OneBus.git OneBus
      - name: Build and run
        run: CXX=${{ matrix.cxx }} OneMachine/test/native.sh

  # The same programs with cl.exe.
  msvc:
    name: native (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: OneMachine
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Clone HAPI and OneBus
        run: |
          git clone --depth 1 $env:ORG/HAPI.git HAPI
          git clone --depth 1 --branch $env:BRANCH $env:ORG/OneBus.git OneBus
          if ($LASTEXITCODE -ne 0) { git clone --depth 1 $env:ORG/OneBus.git OneBus }
      - name: Build and run
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $inc = @("/I$ws\OneMachine\include", "/I$ws\HAPI\include", "/I$ws\OneBus\include")
          $programs = @(
            @{ p = "discover/round1";  d = "" },
            @{ p = "discover/round2";  d = "/DR2_NO_MQTT" },
            @{ p = "discover/round3";  d = "" },
            @{ p = "discover/round3b"; d = "" },
            @{ p = "discover/spi1";    d = "" },
            @{ p = "fail/unit_f1";     d = "" },
            @{ p = "fail/unit_f2";     d = "" },
            @{ p = "fail/unit_f3";     d = "" },
            @{ p = "fail/roundF1";     d = "" },
            @{ p = "fail/roundF5";     d = "/DF5_COUNT /DF5_TAP" },
            @{ p = "fail/roundF7";     d = "" },
            @{ p = "rosCompose/round1"; d = "" },
            @{ p = "state/check_net";    d = "" },
            @{ p = "state/check_wire";   d = "" },
            @{ p = "state/array_check";  d = "" },
            @{ p = "state/nested_check"; d = "" },
            @{ p = "state/example";      d = "" },
            @{ p = "role/role_check";    d = "" },
            @{ p = "role/call_check";    d = "" }
          )
          $status = 0
          foreach ($e in $programs) {
            $dir = Join-Path "$ws\OneMachine\test" (Split-Path $e.p -Parent)
            $name = Split-Path $e.p -Leaf
            $defs = @(); if ($e.d) { $defs = $e.d -split " " }
            Push-Location $dir
            Write-Host "=== $($e.p) ==="
            cl /std:c++17 /W4 /EHsc /nologo /permissive- @defs @inc "$name.cpp" /Fe:"$name.exe"
            if ($LASTEXITCODE -ne 0) { Write-Host "FAILED (compile): $($e.p)"; $status = 1; Pop-Location; continue }
            & ".\$name.exe"
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              Write-Host ("FAILED (run): {0}, exit code 0x{1:X8}" -f $e.p, $code)
              $status = 1
              # again with stdout unbuffered (a crash loses buffered output), so the output shows how far it got
              Set-Content -Path unbuf.h -Value '#include <cstdio>', 'namespace { struct Unbuf { Unbuf() { std::setvbuf(stdout, nullptr, _IONBF, 0); } } unbuf_; }'
              cl /std:c++17 /EHsc /nologo /permissive- /Zi /Od /FIunbuf.h @defs @inc "$name.cpp" /Fe:"${name}_dbg.exe"
              if ($LASTEXITCODE -eq 0) {
                & ".\${name}_dbg.exe"; Write-Host "unbuffered run exit code: $LASTEXITCODE"
                # and the call stack at the crash, from the Windows debugger when the image has it
                $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
                if (Test-Path $cdb) { & $cdb -g -G -c "k 40;q" ".\${name}_dbg.exe" } else { Write-Host "cdb not available" }
              }
            }
            Pop-Location
          }
          exit $status

  # The full suites: native, AVR (avr-g++ -Os), the zero-cost and byte-identity baselines, and the simavr checksums.
  # They share simavr's gdb port, so they run one after another.
  suites:
    name: suites (native + AVR + simavr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: OneMachine
      - name: Clone HAPI, OneBus and OneChip
        run: |
          git clone --depth 1 $ORG/HAPI.git HAPI
          git clone --depth 1 --branch "$BRANCH" $ORG/OneBus.git OneBus || git clone --depth 1 $ORG/OneBus.git OneBus
          git clone --depth 1 --branch "$BRANCH" $ORG/OneChip.git OneChip || git clone --depth 1 $ORG/OneChip.git OneChip
      # The air sensor as a machine of OneMenu nodes and its Python consumer (test/discover/build_spi1.sh, test/link): they build against OneData, OneMenu and the
      # libraries OneMenu includes, at the same branch name when it exists, else main.
      - name: Clone OneData, OneMenu and what OneMenu includes
        run: |
          for r in OneData OneMenu OneItem OneOutput OneBit OnePin OneParse OneInput OneIO; do
            git clone --depth 1 --branch "$BRANCH" $ORG/$r.git $r || git clone --depth 1 $ORG/$r.git $r
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the AVR toolchain and simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc binutils-avr simavr gdb-avr clang
      - name: discover
        run: OneMachine/test/discover/build.sh
      - name: fail
        run: OneMachine/test/fail/build.sh
      - name: rosCompose
        run: OneMachine/test/rosCompose/build.sh
      - name: state
        run: OneMachine/test/state/build.sh
      - name: role
        run: OneMachine/test/role/build.sh

  # Every example, built for each board its platformio.ini names.
  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: OneMachine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone the libraries the examples build against
        run: |
          git clone --depth 1 $ORG/HAPI.git HAPI
          git clone --depth 1 --branch "$BRANCH" $ORG/OneBus.git OneBus || git clone --depth 1 $ORG/OneBus.git OneBus
          git clone --depth 1 --branch "$BRANCH" $ORG/OneChip.git OneChip || git clone --depth 1 $ORG/OneChip.git OneChip
          # the spi example's air sensor is a machine of OneMenu nodes: OneData and OneMenu, and what they depend on
          git clone --depth 1 --branch "$BRANCH" $ORG/OneData.git OneData || git clone --depth 1 $ORG/OneData.git OneData
          git clone --depth 1 --branch "$BRANCH" $ORG/OneMenu.git OneMenu || git clone --depth 1 $ORG/OneMenu.git OneMenu
          python3 - <<'PY'
          import json, os, subprocess
          seen = {"OneMachine", "HAPI", "OneBus", "OneChip", "OneData", "OneMenu"}
          queue = ["OneBus", "OneChip", "OneData", "OneMenu"]
          while queue:
              name = queue.pop(0)
              path = os.path.join(name, "library.json")
              deps = list(json.load(open(path)).get("dependencies", {})) if os.path.isfile(path) else []
              for dep in deps:
                  if dep in seen:
                      continue
                  seen.add(dep)
                  subprocess.run(["git", "clone", "--depth", "1", f"https://github.com/InternetOfPins/{dep}.git", dep], check=True)
                  queue.append(dep)
          PY
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('OneMachine/examples/*/platformio.ini') }}
      - run: pip install platformio
      - run: OneMachine/test/examples/build.sh
