; health -- recover adds a health monitor: quarantine on flapping, disconnect (its own supply cut) on real trouble.
; See README.md.
[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_unflags = -std=c++11 -std=c++14 -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17 -Wall -Wextra
lib_extra_dirs = ../../..
