; recover -- the MPU6050 with a failure edge: transient faults retried, the device re-probed and re-initialised on
; its own if it comes back. See README.md.
[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_unflags = -std=c++11 -std=c++14 -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17 -Wall -Wextra
lib_extra_dirs = ../../..
