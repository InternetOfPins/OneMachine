; discover -- finds a real MPU6050 on the I2C bus and prints the table. See README.md.
[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_unflags = -std=c++11 -std=c++14 -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17 -Wall -Wextra
; Local source tree, not GitHub -- matches every other example in this family.
lib_extra_dirs = ../../..
