; sila -- the machine of src/machine.h on a Nano, served over SiLA 2 by gateway.py. See README.md.
[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_unflags = -std=c++11 -std=c++14 -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17 -Wall -Wextra
; Local source tree, not GitHub -- matches every other example in this family.
lib_extra_dirs = ../../..
