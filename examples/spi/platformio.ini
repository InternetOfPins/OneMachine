; spi -- an RC522 found on an SPI bus with static chip-select slots, a BMP280 found on I2C. See README.md.
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
build_unflags = -std=c++11 -std=c++14 -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17 -Wall -Wextra
lib_extra_dirs = ../../..
extra_scripts = pre:../version.py

; the same sketch with the serial port carrying the link (link/frame.h) instead of the log: a consumer reads the description, gets and sets by code, reads the changes
[env:d1_mini_link]
extends = env:d1_mini
build_flags = ${env:d1_mini.build_flags} -DONEMACHINE_LINK
